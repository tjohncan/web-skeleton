name: tests

# Pull requests, pushes to main, plus a manual button.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the in-flight run.
# Runs on main are not cancelled: every merge deserves a full test-suite report card.
# Two branches that are each green, individually, can merge into a red tree.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: these jobs build and test, they never write to the repo.
permissions:
  contents: read

# Two jobs, one at each end of the SBCLs this supports. cold-build runs the
# oldest: Ubuntu 24.04's packaged SBCL is 2.2.9, the version README
# requires, so the image is named rather than left to ubuntu-latest, which
# would raise the floor without saying so when it moves. latest-sbcl runs
# Debian testing's packaged SBCL, the newest a distribution ships.
jobs:
  cold-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The Lisp suite cannot see a JavaScript syntax error, and the demo page
      # is served from this repo. A corrupt app.js is a dead page — no socket,
      # no census, no tab switching — behind a totals line reading ALL TESTS
      # PASSED, because none of those tests are in the browser. A regex
      # literal that loses its escapes is enough to do it.
      #
      # node --check is a real parse, not a lint, and the runner already has
      # node, so this costs a second and installs nothing.
      - name: Parse the demo's JavaScript
        run: |
          set -o pipefail
          found=0
          for f in demo/static/*.js; do
            [ -e "$f" ] || continue
            found=$((found + 1))
            echo "checking $f"
            node --check "$f"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no .js found under demo/static — this check is now vacuous"
            exit 1
          fi

      # Ubuntu runners already carry libssl3 and glibc's getent, so the
      # optional web-skeleton-tls system loads: the suite exercises the
      # libssl crypto swap AND re-verifies the pure-Lisp originals against it.
      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl
          sbcl --version
          # The floor is the point of this job, so a different SBCL fails it
          # rather than passing in its place.
          sbcl --version | grep -q '^SBCL 2\.2\.9' || {
            echo "::error::expected SBCL 2.2.9 here, the supported floor"; exit 1; }

      # One step, one run, and it must be a COLD build.
      # ASDF compiles to ~/.cache/common-lisp and reuses the fasls on any later run.
      # A warm run loads without compiling, so it emits no "caught WARNING" lines at all.
      # A fresh runner starts with no cache, so this is already cold.
      # The rm makes that a stated invariant.
      #
      # set -o pipefail so sbcl's exit code survives the pipe through tee —
      # the default shell here is `bash -e`, which otherwise only reports tee's success.
      # run-tests.lisp exits 1 on any failure.
      - name: Run test suite (cold build, fail on compile warnings)
        run: |
          set -o pipefail
          rm -rf ~/.cache/common-lisp
          sbcl --non-interactive --load run-tests.lisp 2>&1 | tee /tmp/build.log
          # Assert the suite ran before believing anything it did not say.
          # Every other leg of this gate — the exit code, the warnings grep,
          # the totals — is downstream of RUN-TESTS.LISP actually executing,
          # and nothing here checked that it did. SBCL stops option parsing
          # at the first token it does not recognise and hands the rest to
          # the toplevel, so a mistyped flag prints a banner, loads nothing,
          # emits no warnings and exits 0. That is a green build with zero
          # tests run, and it would look exactly like a clean one.
          if ! grep -qE '=== (ALL TESTS PASSED|SOME TESTS FAILED) ===' /tmp/build.log; then
            echo "::error::the suite did not run — no totals line in the log"
            tail -20 /tmp/build.log
            exit 1
          fi
          if grep -qiE 'caught (warning|style-warning)' /tmp/build.log; then
            echo "::error::compile emitted warnings"
            grep -iE -B2 -A6 'caught (warning|style-warning)' /tmp/build.log
            exit 1
          fi

      # The demo is a consumer of the framework, and the test system depends
      # on the framework and the harness rather than on it — so without this
      # step nothing in this job compiles demo/. A symbol that is external in
      # one SBCL and internal in another is a READ error where it is
      # internal, not a warning, and only loading the demo system finds it
      # before a deployment does.
      #
      # Loading the system is most of the check: a demo that does not compile
      # has no behaviour to test. demo/test-demo.lisp checks the Origin check
      # on /ws, the page's only security control and the part of it most
      # likely to be copied into something else, and a few of the demo's own
      # small functions. It runs between the load and the sentinel, so a
      # wrong answer leaves no sentinel either.
      #
      # Success is a file, not a word in the log, and that is not fussiness.
      # A step that printed DEMO COMPILED and grepped for it would pass on a
      # failing build, because SBCL prints its --eval list in the backtrace,
      # so the log of the failure contains the exact string that was
      # supposed to prove success. A sentinel the failure can quote back is
      # not a sentinel. This one exists only if the form ran.
      #
      # The suite's own totals-line check above is safe from this because
      # run-tests.lisp arrives through --load, so the string it prints is
      # nowhere on the command line.
      - name: Compile the demo system, and run its checks
        run: |
          set -o pipefail
          rm -f /tmp/demo.ok
          sbcl --non-interactive \
               --eval '(require :asdf)' \
               --eval '(push *default-pathname-defaults* asdf:*central-registry*)' \
               --eval '(asdf:load-system "web-skeleton-demo")' \
               --load demo/test-demo.lisp \
               --eval '(with-open-file (f "/tmp/demo.ok" :direction :output) (write-line "ok" f))' \
               2>&1 | tee /tmp/demo.log
          if [ ! -f /tmp/demo.ok ]; then
            echo "::error::the demo system did not load, or one of its checks failed"
            tail -40 /tmp/demo.log
            exit 1
          fi
          if grep -qiE 'caught (warning|style-warning)' /tmp/demo.log; then
            echo "::error::the demo emitted compile warnings"
            grep -iE -B2 -A6 'caught (warning|style-warning)' /tmp/demo.log
            exit 1
          fi

  # The same suite and demo checks on the newest packaged SBCL. Debian
  # testing's image is Debian's own, from Debian's mirrors, so it is as
  # reliable a source as the runner's. The checks are cold-build's, step for
  # step, and their reasons are written there.
  latest-sbcl:
    runs-on: ubuntu-latest
    container: debian:testing-slim
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # openssl brings libssl, and its CLI is what the TLS tests generate
      # their certificates with. getent comes with the image's glibc.
      - name: Install SBCL and libssl
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sbcl openssl ca-certificates
          sbcl --version

      - name: Run test suite (cold build, fail on compile warnings)
        run: |
          set -o pipefail
          rm -rf ~/.cache/common-lisp
          sbcl --non-interactive --load run-tests.lisp 2>&1 | tee /tmp/build.log
          if ! grep -qE '=== (ALL TESTS PASSED|SOME TESTS FAILED) ===' /tmp/build.log; then
            echo "::error::the suite did not run — no totals line in the log"
            tail -20 /tmp/build.log
            exit 1
          fi
          if grep -qiE 'caught (warning|style-warning)' /tmp/build.log; then
            echo "::error::compile emitted warnings"
            grep -iE -B2 -A6 'caught (warning|style-warning)' /tmp/build.log
            exit 1
          fi

      - name: Compile the demo system, and run its checks
        run: |
          set -o pipefail
          rm -f /tmp/demo.ok
          sbcl --non-interactive \
               --eval '(require :asdf)' \
               --eval '(push *default-pathname-defaults* asdf:*central-registry*)' \
               --eval '(asdf:load-system "web-skeleton-demo")' \
               --load demo/test-demo.lisp \
               --eval '(with-open-file (f "/tmp/demo.ok" :direction :output) (write-line "ok" f))' \
               2>&1 | tee /tmp/demo.log
          if [ ! -f /tmp/demo.ok ]; then
            echo "::error::the demo system did not load, or one of its checks failed"
            tail -40 /tmp/demo.log
            exit 1
          fi
          if grep -qiE 'caught (warning|style-warning)' /tmp/demo.log; then
            echo "::error::the demo emitted compile warnings"
            grep -iE -B2 -A6 'caught (warning|style-warning)' /tmp/demo.log
            exit 1
          fi
