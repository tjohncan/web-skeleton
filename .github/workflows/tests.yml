name: tests

# Pull requests, pushes to main, plus a manual button.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the in-flight run.
# Runs on main are not cancelled: every merge deserves a full test-suite report card.
# Two branches that are each green, individually, can merge into a red tree.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: this job builds and tests, it never writes to the repo.
permissions:
  contents: read

jobs:
  cold-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Ubuntu runners already carry libssl3 and glibc's getent, so the
      # optional web-skeleton-tls system loads: the suite exercises the
      # libssl crypto swap AND re-verifies the pure-Lisp originals against it.
      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl
          sbcl --version

      # One step, one run, and it must be a COLD build.
      # ASDF compiles to ~/.cache/common-lisp and reuses the fasls on any later run.
      # A warm run loads without compiling, so it emits no "caught WARNING" lines at all.
      # A fresh runner starts with no cache, so this is already cold.
      # The rm makes that a stated invariant.
      #
      # set -o pipefail so sbcl's exit code survives the pipe through tee —
      # the default shell here is `bash -e`, which otherwise only reports tee's success.
      # run-tests.lisp exits 1 on any failure.
      - name: Run test suite (cold build, fail on compile warnings)
        run: |
          set -o pipefail
          rm -rf ~/.cache/common-lisp
          sbcl --non-interactive --load run-tests.lisp 2>&1 | tee /tmp/build.log
          # Assert the suite ran before believing anything it did not say.
          # Every other leg of this gate — the exit code, the warnings grep,
          # the totals — is downstream of RUN-TESTS.LISP actually executing,
          # and nothing here checked that it did. SBCL stops option parsing
          # at the first token it does not recognise and hands the rest to
          # the toplevel, so a mistyped flag prints a banner, loads nothing,
          # emits no warnings and exits 0. That is a green build with zero
          # tests run, and it would look exactly like a clean one.
          if ! grep -qE '=== (ALL TESTS PASSED|SOME TESTS FAILED) ===' /tmp/build.log; then
            echo "::error::the suite did not run — no totals line in the log"
            tail -20 /tmp/build.log
            exit 1
          fi
          if grep -qiE 'caught (warning|style-warning)' /tmp/build.log; then
            echo "::error::compile emitted warnings"
            grep -iE -B2 -A6 'caught (warning|style-warning)' /tmp/build.log
            exit 1
          fi
