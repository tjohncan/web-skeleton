# docker compose -f demo/deploy/compose.yml up -d --build
#
# The published port is bound to loopback on purpose. nginx is the only thing
# that should reach this, and "8081:8081" would publish the demo on every
# interface — beside the reverse proxy rather than behind it, with no TLS and
# none of the proxy's rate or connection limits.

services:
  demo:
    build:
      context: ../..
      dockerfile: demo/deploy/Dockerfile
    image: web-skeleton-demo
    container_name: web-skeleton-demo
    # Restarts when the process exits, and only then. The image's healthcheck
    # marks a stuck worker unhealthy, and plain Docker reports that and does
    # nothing else: no restart policy acts on health. Watch the status, or run
    # something that does act on it.
    restart: unless-stopped
    # Capped, because the default json-file driver never rotates. The server
    # logs little at INFO, but nothing bounds a log over months, and on a box
    # shared with another site an unbounded one is a slow way to fill its disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Nothing in the container needs a capability: the server binds 8081,
    # above the privileged ports, as a user that is not root. So none are
    # kept, and no-new-privileges stops anything it runs from gaining one
    # through a setuid binary, of which the base image has several.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      # 0.0.0.0 inside the container, which is not the same as on the host:
      # the published port above is what decides who can arrive.
      WS_HOST: "0.0.0.0"
      WS_PORT: "8081"
      # Pinned rather than left to CPU count. The page's subject is fan-out
      # across workers, and a small instance reporting two of them is a dull
      # exhibit; a fixed number also makes the census reproducible.
      WS_WORKERS: "4"
